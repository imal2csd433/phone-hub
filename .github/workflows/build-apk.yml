name: Build Org Device Guard APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        working-directory: android-agent
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp android-agent/app/build/outputs/apk/debug/app-debug.apk org-device-guard.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: org-device-guard-apk
          path: org-device-guard.apk
